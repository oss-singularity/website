  <title id="banner-title">OSS Singularity — Many minds. One open horizon.</title>
  <desc id="banner-description">Editable vector reconstruction of the generated OSS Singularity banner. Dark navy background, cyan and magenta network orbits, shared light, and the supplied original OSS Singularity brand mark. No embedded raster image. All text remains editable. Fonts: DejaVu Sans for headlines; Inter for the brand name and tagline. This is a reconstruction, not the original source of the AI-generated PNG.</desc>
