name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate repository baseline
        run: ./scripts/check-repository.sh
      - name: Set up Node for the Commons service
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate Commons service with real SQLite transactions
        run: node --test services/commons/test/*.test.mjs
      - name: Validate public mission handoff and private-state boundaries
        run: node --test scripts/test-mission-handoff.mjs scripts/test-theme.mjs scripts/test-work-items-ui.mjs
      - name: Check machine contract rejection cases
        run: python3 scripts/check-agent-data.py --self-test
      - name: Validate static release artifacts and rejection cases
        run: python3 scripts/test-release-artifact.py
      - name: Validate release rehearsal identity and transport fixtures
        run: python3 scripts/test-release-rehearsal.py
      - name: Validate completed candidate identity and archive boundaries
        run: python3 scripts/test-release-candidate.py
      - name: Validate required-check policy and provenance fixtures
        run: python3 scripts/test-release-checks.py
      - name: Validate static operation plans and preservation boundaries
        run: python3 scripts/test-static-plan.py
