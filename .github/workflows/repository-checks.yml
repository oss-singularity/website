name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate repository baseline
        run: ./scripts/check-repository.sh
      - name: Set up Node for the Commons service
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate Commons service with real SQLite transactions
        run: node --test services/commons/test/*.test.mjs
      - name: Validate public mission handoff, private-state boundaries and the UI suites
        run: node --test scripts/test-mission-handoff.mjs scripts/test-theme.mjs scripts/test-work-items-ui.mjs scripts/test-projects-ui.mjs scripts/test-road-so-far.mjs scripts/test-commons-activity.mjs scripts/test-commons-growth-data.mjs
      - name: Check machine contract rejection cases
        run: python3 scripts/check-agent-data.py --self-test
      - name: Validate the delivery receipt verifier
        run: python3 scripts/test-verify-receipt.py
      - name: Validate the contract lab generator and pinned-compiler package
        run: python3 scripts/test-solidity-lab.py
      - name: Walk the settlement model through every outcome including unresponsive participants
        run: python3 scripts/test-fair-settlement.py
      - name: Exercise the independent QA role model with dispute paths
        run: python3 scripts/test-qa-model.py
      - name: Install pinned Foundry for the local-chain settlement exercise
        run: |
          set -eu
          mkdir -p "$HOME/.foundry/bin"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: Run the settlement exercise against a local chain
        run: python3 scripts/test-settlement-anvil.py
      - name: Validate static release artifacts and rejection cases
        run: python3 scripts/test-release-artifact.py
      - name: Validate Commons code artifacts and existing schema profiles
        run: |
          python3 scripts/test-commons-artifact.py
          python3 -O scripts/test-commons-artifact.py
      - name: Validate Commons rehearsal source and artifact identity
        run: |
          python3 scripts/test-commons-rehearsal.py
          python3 -O scripts/test-commons-rehearsal.py
      - name: Validate completed Commons candidates, source and required checks
        run: |
          python3 scripts/test-commons-candidate.py
          python3 -O scripts/test-commons-candidate.py
      - name: Validate version-bound Commons plans and preservation
        run: |
          python3 scripts/test-commons-plan.py
          python3 -O scripts/test-commons-plan.py
      - name: Validate Commons transition fixture and crash recovery
        run: |
          python3 scripts/test-commons-transition.py
          python3 -O scripts/test-commons-transition.py
      - name: Validate Cloudflare API adapter and offline provider contracts
        run: |
          python3 scripts/test-commons-cloudflare.py
          python3 -O scripts/test-commons-cloudflare.py
      - name: Validate the Commons promotion engine and durable intent records
        run: |
          python3 scripts/test-commons-promotion.py
          python3 -O scripts/test-commons-promotion.py
      - name: Validate the promotion command derivations and output contract
        run: |
          python3 scripts/test-commons-promotion-cli.py
          python3 -O scripts/test-commons-promotion-cli.py
      - name: Validate release rehearsal identity and transport fixtures
        run: python3 scripts/test-release-rehearsal.py
      - name: Validate completed candidate identity and archive boundaries
        run: python3 scripts/test-release-candidate.py
      - name: Validate required-check policy and provenance fixtures
        run: python3 scripts/test-release-checks.py
      - name: Validate static operation plans and preservation boundaries
        run: python3 scripts/test-static-plan.py
      - name: Validate journaled static fixtures and fresh-process recovery
        run: |
          python3 scripts/test-static-transition.py
          python3 -O scripts/test-static-transition.py
      - name: Validate fixed-command static observation and isolation boundaries
        run: |
          python3 scripts/test-static-remote-observe.py
          python3 -O scripts/test-static-remote-observe.py
      - name: Validate installed static writer protocol and recovery
        run: |
          python3 scripts/test-static-remote.py
          python3 -O scripts/test-static-remote.py
      - name: Validate static publication handoff and recovery
        run: |
          python3 scripts/test-static-publication.py
          python3 -O scripts/test-static-publication.py
      - name: Validate blocked-record recovery and closed deployments
        run: |
          python3 scripts/test-static-recovery.py
          python3 -O scripts/test-static-recovery.py
