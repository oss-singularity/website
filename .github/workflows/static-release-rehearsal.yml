name: Static release rehearsal

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: static-release-rehearsal
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.server_url == 'https://github.com' &&
      github.repository == 'oss-singularity/website' &&
      github.repository_id == '1351274990' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact canonical commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source identity and current protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-rehearsal.py gate --checkout-commit "$(git rev-parse HEAD)"
      - name: Build and compare two static candidates
        shell: bash
        run: |
          set -euo pipefail
          candidate_root=$(mktemp -d "$RUNNER_TEMP/oss-candidate.XXXXXX")
          printf 'CANDIDATE_ROOT=%s\n' "$candidate_root" >> "$GITHUB_ENV"
          mkdir "$candidate_root/staging" "$candidate_root/reports"
          ./scripts/build-site.sh "$candidate_root/staging/payload"
          TZ=Pacific/Honolulu ./scripts/build-site.sh "$candidate_root/rebuild"
          python3 scripts/release-artifact.py create \
            --artifact-dir "$candidate_root/staging/payload" \
            --commit "$GITHUB_SHA" \
            --out "$candidate_root/staging/release.json" > "$candidate_root/reports/create.json"
          python3 scripts/release-artifact.py verify \
            --artifact-dir "$candidate_root/staging/payload" \
            --descriptor "$candidate_root/staging/release.json" \
            --expected-commit "$GITHUB_SHA" \
            --rebuild-dir "$candidate_root/rebuild" > "$candidate_root/reports/rebuild.json"
      - name: Upload only the verified static candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/staging/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Download the exact uploaded artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          path: ${{ env.CANDIDATE_ROOT }}/download/
          digest-mismatch: error
      - name: Verify the round trip and record observed identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-artifact.py verify \
            --artifact-dir "$CANDIDATE_ROOT/download/payload" \
            --descriptor "$CANDIDATE_ROOT/download/release.json" \
            --expected-commit "$GITHUB_SHA" \
            --rebuild-dir "$CANDIDATE_ROOT/staging/payload" > "$CANDIDATE_ROOT/reports/roundtrip.json"
          python3 scripts/release-rehearsal.py receipt \
            --checkout-commit "$(git rev-parse HEAD)" \
            --artifact-id "$CANDIDATE_ID" \
            --artifact-digest "$CANDIDATE_DIGEST" \
            --descriptor "$CANDIDATE_ROOT/download/release.json" \
            --roundtrip-report "$CANDIDATE_ROOT/reports/roundtrip.json" \
            --out "$CANDIDATE_ROOT/reports/dry-run-plan.json"
      - name: Publish the separate rehearsal receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-rehearsal-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_ROOT }}/reports/dry-run-plan.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
