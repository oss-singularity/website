name: Commons release rehearsal

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: commons-release-rehearsal
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.server_url == 'https://github.com' &&
      github.repository == 'oss-singularity/website' &&
      github.repository_id == '1351274990' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact canonical commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source identity and current protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/commons-release-rehearsal.py gate --checkout-commit "$(git rev-parse HEAD)"
      - name: Create and independently verify the Commons packet
        shell: bash
        run: |
          set -euo pipefail
          commons_root=$(mktemp -d "$RUNNER_TEMP/oss-commons-candidate.XXXXXX")
          printf 'COMMONS_ROOT=%s\n' "$commons_root" >> "$GITHUB_ENV"
          mkdir "$commons_root/staging" "$commons_root/reports"
          python3 scripts/commons-artifact.py create \
            --source-dir services/commons --commit "$GITHUB_SHA" \
            --out "$commons_root/staging/commons.json" > "$commons_root/reports/create.json"
          python3 scripts/commons-artifact.py verify \
            --candidate "$commons_root/staging/commons.json" --expected-commit "$GITHUB_SHA" \
            --expected-schema-sha256 1d1800a100d598b2076c4932ad866e4e254595326eb7fb387522b51775f01278 \
            --rebuild-source services/commons > "$commons_root/reports/rebuild.json"
      - name: Upload only the verified Commons packet
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commons-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.COMMONS_ROOT }}/staging/commons.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Download the exact uploaded Commons artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          path: ${{ env.COMMONS_ROOT }}/download/
          digest-mismatch: error
      - name: Verify the round trip against source and observe artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/commons-release-rehearsal.py receipt \
            --checkout-commit "$(git rev-parse HEAD)" \
            --artifact-id "$CANDIDATE_ID" --artifact-digest "$CANDIDATE_DIGEST" \
            --candidate "$COMMONS_ROOT/download/commons.json" --source-dir services/commons \
            --out "$COMMONS_ROOT/reports/receipt.json"
      - name: Publish the separate Commons rehearsal receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commons-rehearsal-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.COMMONS_ROOT }}/reports/receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
