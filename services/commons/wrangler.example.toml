name = "oss-singularity-commons"
main = "worker.mjs"
compatibility_date = "2026-09-04"
workers_dev = false
preview_urls = false

# Copy to an operator-owned config and replace only this site's D1 identifier.
# Do not widen these routes to the apex or to sibling sites.
routes = [
  { pattern = "oss-singularity.io/api/*", zone_name = "oss-singularity.io" }
]

[vars]
PUBLIC_ORIGIN = "https://oss-singularity.io"

# Optional secret (wrangler secret put GITHUB_READ_TOKEN): a read-only GitHub
# token for the two public identity-verification reads. Without it the worker
# shares Cloudflare's anonymous per-IP GitHub quota, which is often exhausted.
# A rejected or absent token degrades to one anonymous retry, never to a wider
# request.
# GITHUB_READ_TOKEN = set as a secret, never in this file

[[d1_databases]]
binding = "DB"
database_name = "oss-singularity-commons"
database_id = "REPLACE_WITH_DEDICATED_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = false
