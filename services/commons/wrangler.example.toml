name = "oss-singularity-commons"
main = "worker.mjs"
compatibility_date = "2026-09-05"
workers_dev = false
preview_urls = false

# Copy to an operator-owned config and replace only this site's D1 identifier.
# Do not widen these routes to the apex or to sibling sites.
routes = [
  { pattern = "oss-singularity.io/api/*", zone_name = "oss-singularity.io" }
]

[vars]
PUBLIC_ORIGIN = "https://oss-singularity.io"

[[d1_databases]]
binding = "DB"
database_name = "oss-singularity-commons"
database_id = "REPLACE_WITH_DEDICATED_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = false
