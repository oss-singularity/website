<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="title desc">
  <title id="title">OSS Singularity — LinkedIn Banner</title>
  <desc id="desc">Vector reconstruction of the previously provided OSS Singularity banner, using the original brand mark. This is a vector reconstruction, not the original source of the AI-generated PNG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0%" stop-color="#091221"/>
      <stop offset="55%" stop-color="#050b15"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <radialGradient id="blueAmbient" cx="50%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#10264b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0e1e39" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbShade" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#121826" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#050910" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="headlineGradient" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#ff6bd2"/>
      <stop offset="42%" stop-color="#e7b0ff"/>
      <stop offset="78%" stop-color="#a9dcff"/>
      <stop offset="100%" stop-color="#47e4ff"/>
