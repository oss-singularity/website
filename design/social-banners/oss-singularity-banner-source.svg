      <stop offset="100%" stop-color="#69f0ff"/>
    </linearGradient>
    <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff43c6"/>
      <stop offset="26%" stop-color="#d47df0"/>
      <stop offset="56%" stop-color="#8fd4ff"/>
      <stop offset="100%" stop-color="#29e1ff"/>
    </linearGradient>
    <linearGradient id="trailMagenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5ccd" stop-opacity="0.25"/>
      <stop offset="28%" stop-color="#ff6ad2"/>
      <stop offset="100%" stop-color="#76e9ff"/>
    </linearGradient>
    <linearGradient id="trailBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59e8ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#d8b6ff"/>
      <stop offset="100%" stop-color="#72eaff"/>
    </linearGradient>
    <linearGradient id="sharedLight" x1="510" y1="451" x2="840" y2="451" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#bdf3ff"/>
      <stop offset="70%" stop-color="#57d8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b86af1" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="wideGlow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.3"/></filter>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="cropTop"><rect width="2172" height="616"/></clipPath>
  </defs>

